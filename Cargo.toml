[package]
name = "sarracenia"
version = "0.3.3"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/katalyxbio/sarracenia"
keywords = ["bioinformatics", "demultiplexing", "nanopore", "ONT"]
description = "Extremely fast and accurate Nanopore demultiplexing"

[lib]
name = "sarracenia"
path = "src/lib.rs"

[[bin]]
name = "sarracenia"
path = "bin/main.rs"

[dependencies]
noodles = { version = "0.110.0", features = ["bam", "sam", "bgzf"] }
bstr = "1.0"
flate2 = "1.1"
sassy = "0.2.1"
pa-types = "1.2.0"
seq_io = "0.3.4"
rand = "0.8"
needletail = "0.6.3"
rayon = "1.10.0"
clap = { version = "4.5.40", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0.102"
tempfile = "3.2"
serde_json = "1.0"
once_cell = "1.19.0"
thread-id = "5.0.0"
plotpy = "1.13.0"
itertools = "0.14.0"
glob = "0.3.3"
cigar-lodhi-rs =  "0.1.0"
ensure_simd = "0.1.0"
log = "0.4.29"
env_logger = "0.11.9"

[workspace]
members = [
    ".",
    "benchmarks"
]

[profile.release]
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = true

